# Compila Mitis y crea sus paquetes. En cada push y pull request, Windows
# (instalador propio, installer/) y macOS (.dmg universal: Apple Silicon e
# Intel); Linux (AppImage) se compila a mano: pestaña Actions → Compilar →
# Run workflow → «todos». Con una etiqueta «v*» (p. ej. v0.5.0) publica el
# instalador y el .dmg en un release de GitHub.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A mano (pestaña Actions → Compilar → Run workflow): Windows y macOS, o
  # también Linux
  workflow_dispatch:
    inputs:
      sistemas:
        description: "Qué compilar"
        type: choice
        options: [windows-macos, macos, todos]
        default: windows-macos

env:
  # Qt 6.11.3 (el mínimo es la 6.8; en desarrollo, la 6.11 de Arch). No la
  # más alta: Qt WebEngine 6.11.3 y 6.12.0 usan el mismo Chromium (140),
  # pero la 6.11.3 lleva parches de seguridad hasta el 155 y la 6.12.0 solo
  # hasta el 147 (comprobado en 2026-10). Al cambiar de versión, mirar el
  # archivo CHROMIUM_VERSION de qtwebengine en esa etiqueta. La variable del
  # repositorio QT_VERSION la fija (p. ej. para usar Qt con códecs).
  QT_VERSION: ${{ vars.QT_VERSION || '6.11.3' }}
  # Desde la 6.11, Qt reorganizó su repositorio de descargas y aqtinstall
  # 3.3.0 (el último publicado) no sabe instalarla en Windows («Failed to
  # locate XML data»). Su versión en desarrollo sí («Support Qt 6.11+ for
  # Windows X64»): se instala desde este commit fijo (comprobado con
  # 6.12.0, que tiene el mismo formato que la 6.11.3). Quitar cuando salga
  # aqtinstall 3.4.
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
  QT_MODULES: "qtwebengine qtwebchannel qtpositioning"
  # Qt WebEngine con códecs propietarios (H.264, AAC), compilado aparte
  # (docs/codecs.md): release con los archivos. Vacío: el Qt oficial, sin códecs
  QT_CODECS_RELEASE: ${{ vars.QT_CODECS_RELEASE }}
  QT_CODECS_REPO: ${{ vars.QT_CODECS_REPO || github.repository }}
  # Otra clave de caché con códecs: el Qt modificado no debe pisar al oficial
  QT_CACHE_PREFIX: ${{ vars.QT_CODECS_RELEASE && format('qt-codecs-{0}', vars.QT_CODECS_RELEASE) || 'install-qt-action' }}

jobs:
  linux:
    name: Linux
    # Solo a mano, eligiendo «todos» (por ahora la versión es solo para Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.sistemas == 'todos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: ${{ env.QT_CACHE_PREFIX }}

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Bibliotecas que linuxdeploy debe encontrar para copiarlas dentro del
      # AppImage (dependencias de libqxcb y de Qt WebEngine)
      - name: Dependencias del AppImage
        run: |
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64 \
            libegl1 libfontconfig1 libdbus-1-3

      # El script calcula la versión desde CMakeLists.txt
      - name: Empaquetar (AppImage)
        run: packaging/linux/appimage.sh build .

      - uses: actions/upload-artifact@v4
        with:
          name: mitis-linux
          path: Mitis-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows (instalador)
    # TEMPORAL (2026-10-23): en los push solo se compila macOS (la versión de
    # Windows de esta versión ya está hecha). Windows, a mano: Run workflow →
    # «windows-macos» o «todos». Quitar este «if» antes de publicar una
    # versión: con él, un push de etiqueta no compila Windows y no se publica
    if: github.event_name == 'workflow_dispatch' && inputs.sistemas != 'macos'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Consola de Visual Studio (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: ${{ env.QT_CACHE_PREFIX }}

      # Encima del Qt oficial; windeployqt lo copia después al instalador
      - name: Qt WebEngine con códecs propietarios
        if: env.QT_CODECS_RELEASE != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.QT_CODECS_TOKEN || github.token }}
        run: |
          gh release download $env:QT_CODECS_RELEASE --repo $env:QT_CODECS_REPO --pattern "qtwebengine-codecs-*-windows-*.7z" --dir codecs
          if ($LASTEXITCODE -ne 0) { throw "No se pudo descargar el Qt con códecs de $env:QT_CODECS_REPO ($env:QT_CODECS_RELEASE)" }
          $archivo = Get-ChildItem codecs -Filter *.7z | Select-Object -First 1
          7z x $archivo.FullName -ocodecs/qt -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "No se pudo extraer $($archivo.Name)" }
          # Misma versión exacta: Qt WebEngine usa API privada de Qt
          $qt = (& "$env:QT_ROOT_DIR/bin/qmake.exe" -query QT_VERSION).Trim()
          $marca = Get-Content codecs/qt/mitis-codecs.txt
          if (-not ($marca -contains "qt=$qt")) { throw "El Qt con códecs no es para Qt $qt ($($marca -join ', ')): ajusta la variable QT_VERSION" }
          # robocopy: 0-7 es éxito (1 = archivos copiados)
          robocopy codecs/qt $env:QT_ROOT_DIR /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "No se pudo copiar el Qt con códecs" }
          Write-Host "Qt WebEngine con códecs propietarios ($($marca -join ', '))"
          exit 0

      - name: Versión
        id: version
        shell: bash
        # Con el sufijo de la etapa (MITIS_VERSION_SUFFIX: 0.5.0-beta)
        run: |
          version=$(sed -n '/^project(Mitis/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          sufijo=$(sed -n 's/^set(MITIS_VERSION_SUFFIX "\([^"]*\)".*/\1/p' CMakeLists.txt)
          echo "valor=$version$sufijo" >> "$GITHUB_OUTPUT"

      - name: Compilar Mitis
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Compilar el instalador
        run: |
          # Entre comillas: PowerShell parte «-DX=0.5.0-beta» por el punto
          cmake -S installer -B build-instalador -G Ninja -DCMAKE_BUILD_TYPE=Release "-DMITIS_VERSION=${{ steps.version.outputs.valor }}"
          cmake --build build-instalador

      - name: Empaquetar
        shell: pwsh
        run: >
          ./installer/empaquetar.ps1
          -Mitis build/bin/Mitis.exe
          -Instalador build-instalador/MitisInstalador.exe
          -Salida Mitis-${{ steps.version.outputs.valor }}-Instalador.exe

      - uses: actions/upload-artifact@v4
        with:
          name: mitis-windows
          path: Mitis-*-Instalador.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg universal)
    # Apple Silicon (el runner) e Intel en un solo binario universal. El Qt
    # oficial de macOS (clang_64) ya es universal: basta con pedir las dos
    # arquitecturas al compilar Mitis
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: ${{ env.QT_CACHE_PREFIX }}

      # Encima del Qt oficial; macdeployqt lo copia después a Mitis.app. Para
      # el .dmg universal, el archivo debe compilarse universal también
      # (tools/codecs/compilar-macos.sh --arquitecturas "arm64;x86_64")
      - name: Qt WebEngine con códecs propietarios
        if: env.QT_CODECS_RELEASE != ''
        env:
          GH_TOKEN: ${{ secrets.QT_CODECS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh release download "$QT_CODECS_RELEASE" --repo "$QT_CODECS_REPO" --pattern "qtwebengine-codecs-*-macos-*.tar.xz" --dir codecs
          mkdir -p codecs/qt
          tar -xJf codecs/qtwebengine-codecs-*-macos-*.tar.xz -C codecs/qt
          # Misma versión exacta: Qt WebEngine usa API privada de Qt
          qt=$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)
          if ! grep -qx "qt=$qt" codecs/qt/mitis-codecs.txt; then
            echo "::error::El Qt con códecs no es para Qt $qt ($(tr '\n' ' ' < codecs/qt/mitis-codecs.txt)): ajusta la variable QT_VERSION"
            exit 1
          fi
          # ditto mezcla carpetas y conserva los enlaces simbólicos de los frameworks
          ditto codecs/qt "$QT_ROOT_DIR"
          echo "Qt WebEngine con códecs propietarios: $(tr '\n' ' ' < codecs/qt/mitis-codecs.txt)"

      - name: Versión
        id: version
        run: echo "valor=$(sed -n '/^project(Mitis/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Compilar (universal)
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build

      # Qt va dentro de Mitis.app; el .dmg se abre y se arrastra a Aplicaciones
      - name: Empaquetar
        run: |
          set -euo pipefail
          app=build/bin/Mitis.app
          # El bundle sale sin Resources (aún no hay icono .icns que la cree)
          mkdir -p "$app/Contents/Resources"
          cp LICENSE "$app/Contents/Resources/"
          cp -R licencias "$app/Contents/Resources/"
          macdeployqt "$app" -qmldir=qml
          # Las dos arquitecturas, en Mitis y en el proceso de Qt WebEngine
          # (si el Qt instalado no fuera universal, se nota aquí y no en el
          # Mac de quien lo descarga)
          proceso=$(find "$app/Contents/Frameworks" -type f -path "*QtWebEngineProcess.app/Contents/MacOS/QtWebEngineProcess" | head -n 1)
          if [ -z "$proceso" ]; then
            echo "::error::No está QtWebEngineProcess dentro de Mitis.app (¿macdeployqt no copió Qt WebEngine?)"
            exit 1
          fi
          for binario in "$app/Contents/MacOS/Mitis" "$proceso"; do
            arquitecturas=$(lipo -archs "$binario")
            echo "$(basename "$binario"): $arquitecturas"
            for a in arm64 x86_64; do
              case " $arquitecturas " in
                *" $a "*) ;;
                *) echo "::error::$(basename "$binario") no incluye $a ($arquitecturas)"; exit 1 ;;
              esac
            done
          done
          # Firma ad hoc (sin certificado): macdeployqt cambia los binarios y
          # en Apple Silicon un binario sin firma válida no arranca. No evita
          # el aviso de Gatekeeper (eso pide firma de Apple y notarización)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          hdiutil create -volname Mitis -srcfolder "$app" -ov -format UDZO \
            "Mitis-${{ steps.version.outputs.valor }}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mitis-macos
          path: Mitis-*-macOS.dmg
          if-no-files-found: error

  release:
    name: Publicar
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # CMakeLists.txt y CHANGELOG.md
      - uses: actions/checkout@v4

      # La etiqueta debe coincidir con project(VERSION) y tener su sección en CHANGELOG.md
      - name: Versión y notas
        run: |
          version=$(sed -n '/^project(Mitis/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con project(VERSION $version) de CMakeLists.txt"
            exit 1
          fi
          awk -v v="$version" '/^## \[/ { if (dentro) exit; dentro = (index($0, "## [" v "]") == 1); next } dentro' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::CHANGELOG.md no tiene la sección «## [$version]»"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Mitis ${{ github.ref_name }}
          files: paquetes/*
          body_path: notas.md
