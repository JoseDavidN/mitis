# Genera el icono de macOS (mitis.icns) desde assets/branding/mitis-icon.svg
# y lo deja como artefacto para descargarlo y guardarlo en assets/branding/.
# Solo a mano (pestaña Actions → «Icono de macOS» → Run workflow) y una vez:
# iconutil, que crea el .icns, solo existe en macOS. Cuando el .icns esté en
# el repositorio, este workflow se puede borrar.
name: Icono de macOS

on:
  workflow_dispatch:

jobs:
  icono:
    name: mitis.icns
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: brew install librsvg

      # Rejilla de iconos de macOS (Big Sur en adelante): la forma ocupa 824 de
      # 1024 px, centrada, con margen transparente; a sangre se vería más
      # grande que los demás iconos del Dock. La misma proporción en todos
      # los tamaños del .iconset (16 a 1024 px)
      - name: Crear mitis.icns
        run: |
          set -euo pipefail
          svg=assets/branding/mitis-icon.svg
          mkdir -p salida/mitis.iconset
          dibujar() {  # dibujar <lado> <archivo>
            local lado=$1 cuerpo margen
            cuerpo=$(( (lado * 824 + 512) / 1024 ))
            margen=$(( (lado - cuerpo) / 2 ))
            rsvg-convert -w "$cuerpo" -h "$cuerpo" \
              --page-width "$lado" --page-height "$lado" --left "$margen" --top "$margen" \
              "$svg" -o "$2"
          }
          for tam in 16 32 128 256 512; do
            dibujar "$tam" "salida/mitis.iconset/icon_${tam}x${tam}.png"
            dibujar "$((tam * 2))" "salida/mitis.iconset/icon_${tam}x${tam}@2x.png"
          done
          iconutil -c icns salida/mitis.iconset -o salida/mitis.icns
          # Vista previa a 1024 px para revisarlo antes de guardarlo
          dibujar 1024 salida/mitis-icns-1024.png
          ls -l salida salida/mitis.iconset
          # Comprobar que macOS lo lee: lo vuelve a convertir en imágenes
          iconutil -c iconset salida/mitis.icns -o salida/comprobacion.iconset
          ls salida/comprobacion.iconset
          rm -rf salida/comprobacion.iconset

      - uses: actions/upload-artifact@v4
        with:
          name: icono-macos
          path: |
            salida/mitis.icns
            salida/mitis-icns-1024.png
            salida/mitis.iconset
          if-no-files-found: error
