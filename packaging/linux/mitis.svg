     el degradado de la marca (Theme.brand1 → brand2) y una M blanca -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#marca)"/>
  <polyline points="76,178 76,84 128,142 180,84 180,178" fill="none" stroke="#ffffff"
            stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
